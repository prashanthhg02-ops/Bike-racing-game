<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101812">
  <title>Neon Rider — Bike Racing</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f4e9;
      --muted: #9da99c;
      --lime: #d7ff54;
      --panel: rgba(15, 23, 18, .88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 30%, #28382a 0, #141d17 46%, #0c110e 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .game-shell {
      width: min(100vw, 520px);
      height: min(100vh, 900px);
      min-height: 540px;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 3vw, 24px);
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(215, 255, 84, .45);
      border-radius: 13px;
      color: var(--lime);
      background: rgba(215, 255, 84, .08);
      font-size: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: .12em;
      line-height: 1.1;
    }
    .brand small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .17em;
    }

    .sound-button, .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255,255,255,.05);
      font-size: 17px;
      cursor: pointer;
    }
    .sound-button:hover, .icon-button:hover { border-color: var(--lime); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
    }
    .stat {
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 13px;
      background: rgba(255,255,255,.045);
    }
    .stat-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .stat-value {
      margin-top: 4px;
      font-size: 19px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }
    .stat-value span { color: var(--lime); font-size: 11px; }

    .track-wrap {
      position: relative;
      flex: 1;
      min-height: 280px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 20px;
      background: #18251b;
      box-shadow: 0 24px 70px rgba(0,0,0,.4), inset 0 0 40px rgba(0,0,0,.2);
    }
    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, rgba(10,15,12,.2), rgba(10,15,12,.72));
      text-align: center;
    }
    .overlay.hidden { display: none; }
    .card { max-width: 310px; }
    .eyebrow {
      color: var(--lime);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .card h2 {
      margin: 10px 0 8px;
      font-size: clamp(31px, 9vw, 45px);
      letter-spacing: -.05em;
      line-height: .98;
    }
    .card p {
      margin: 0 auto 20px;
      max-width: 270px;
      color: #c1cbc0;
      font-size: 13px;
      line-height: 1.6;
    }
    .primary-button {
      min-width: 170px;
      padding: 13px 22px;
      border: 0;
      border-radius: 11px;
      color: #11170d;
      background: var(--lime);
      box-shadow: 0 5px 25px rgba(215,255,84,.2);
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }
    .primary-button:hover { transform: translateY(-2px); background: #e5ff83; }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .key-hint { display: flex; align-items: center; gap: 7px; }
    kbd {
      min-width: 23px;
      padding: 4px 6px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,.06);
      font: inherit;
      text-align: center;
    }

    .touch-controls { display: none; justify-content: space-between; gap: 12px; }
    .touch-button {
      flex: 1;
      height: 52px;
      border: 1px solid rgba(215,255,84,.28);
      border-radius: 13px;
      color: var(--lime);
      background: rgba(215,255,84,.08);
      font-size: 22px;
      touch-action: none;
      user-select: none;
    }
    .touch-button:active { background: rgba(215,255,84,.2); }

    @media (pointer: coarse), (max-width: 600px) {
      body { align-items: stretch; }
      .game-shell { width: 100vw; height: 100dvh; min-height: 500px; gap: 10px; padding: 12px; }
      .touch-controls { display: flex; }
      .bottom-bar { font-size: 9px; }
    }
    @media (max-height: 650px) {
      .game-shell { min-height: 0; gap: 8px; padding: 10px; }
      .brand-mark, .sound-button { width: 36px; height: 36px; }
      .stat { padding: 7px 10px; }
      .stat-value { font-size: 16px; }
      .touch-button { height: 44px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⌁</div>
        <div>
          <h1>NEON RIDER</h1>
          <small>STREET RACING • 01</small>
        </div>
      </div>
      <button class="sound-button" id="soundButton" aria-label="Toggle sound" title="Toggle sound">♫</button>
    </header>

    <section class="stats" aria-label="Race stats">
      <div class="stat"><div class="stat-label">Distance</div><div class="stat-value"><span id="distance">0</span><span> M</span></div></div>
      <div class="stat"><div class="stat-label">Speed</div><div class="stat-value"><span id="speed">0</span><span> KM/H</span></div></div>
      <div class="stat"><div class="stat-label">Best run</div><div class="stat-value"><span id="best">0</span><span> M</span></div></div>
    </section>

    <section class="track-wrap" aria-label="Bike racing game">
      <canvas id="gameCanvas" aria-label="Race track. Use left and right arrow keys to steer."></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="eyebrow" id="overlayEyebrow">Ready, rider?</div>
          <h2 id="overlayTitle">Own the<br>open road.</h2>
          <p id="overlayText">Dodge traffic, hold your line, and see how far you can ride.</p>
          <button class="primary-button" id="startButton">Start your engine</button>
        </div>
      </div>
    </section>

    <div class="touch-controls" aria-label="Touch controls">
      <button class="touch-button" data-steer="-1" aria-label="Steer left">←</button>
      <button class="touch-button" data-steer="1" aria-label="Steer right">→</button>
    </div>

    <footer class="bottom-bar">
      <div class="key-hint"><kbd>←</kbd><kbd>→</kbd><span>Steer</span></div>
      <div class="key-hint"><kbd>W</kbd><span>Boost</span></div>
      <div>Stay sharp. Ride far.</div>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const track = canvas.parentElement;
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("startButton");
      const distanceNode = document.getElementById("distance");
      const speedNode = document.getElementById("speed");
      const bestNode = document.getElementById("best");
      const keys = new Set();
      const laneCount = 3;
      const player = { lane: 1, x: 0, targetX: 0, lean: 0, invulnerable: 0 };
      let width = 0;
      let height = 0;
      let laneWidth = 0;
      let roadLeft = 0;
      let roadWidth = 0;
      let running = false;
      let distance = 0;
      let speed = 0;
      let roadOffset = 0;
      let spawnTimer = 0;
      let lastTime = 0;
      let traffic = [];
      let particles = [];
      let best = Number(localStorage.getItem("neonRiderBest") || 0);
      let soundEnabled = false;
      let audioContext = null;
      bestNode.textContent = best;

      function resize() {
        const bounds = track.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        roadWidth = Math.min(width * .78, 340);
        roadLeft = (width - roadWidth) / 2;
        laneWidth = roadWidth / laneCount;
        player.x = laneCenter(player.lane);
        if (!running) draw();
      }

      function laneCenter(lane) { return roadLeft + laneWidth * (lane + .5); }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function drawBike(x, y, scale, color, isPlayer, lean = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(lean * .12);
        ctx.scale(scale, scale);
        ctx.shadowColor = isPlayer ? "rgba(215,255,84,.42)" : "rgba(0,0,0,.3)";
        ctx.shadowBlur = isPlayer ? 16 : 8;
        // Wheels
        ctx.fillStyle = "#101411";
        roundedRect(-9, -31, 18, 19, 8); ctx.fill();
        roundedRect(-9, 14, 18, 20, 8); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#68736a";
        roundedRect(-2, -28, 4, 12, 2); ctx.fill();
        roundedRect(-2, 20, 4, 11, 2); ctx.fill();
        // Frame and fairing
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -27);
        ctx.quadraticCurveTo(13, -16, 11, 5);
        ctx.lineTo(7, 24);
        ctx.quadraticCurveTo(0, 31, -7, 24);
        ctx.lineTo(-11, 5);
        ctx.quadraticCurveTo(-13, -16, 0, -27);
        ctx.fill();
        ctx.fillStyle = isPlayer ? "#f5ffd5" : "rgba(255,255,255,.72)";
        ctx.beginPath();
        ctx.moveTo(-5, -12); ctx.quadraticCurveTo(0, -20, 5, -12);
        ctx.lineTo(4, -4); ctx.lineTo(-4, -4); ctx.closePath(); ctx.fill();
        // Rider helmet
        ctx.fillStyle = "#202722";
        ctx.beginPath(); ctx.ellipse(0, -3, 7, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = isPlayer ? "#d7ff54" : "#c5d0c7";
        ctx.beginPath(); ctx.ellipse(0, -5, 5, 5, 0, 0, Math.PI * 2); ctx.fill();
        // Tail light
        ctx.fillStyle = isPlayer ? "#ff5a47" : "#ff846f";
        roundedRect(-4, 25, 8, 3, 2); ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#243a25";
        ctx.fillRect(0, 0, width, height);

        // Moving roadside dashes
        const dashSpacing = 82;
        const sideOffset = roadOffset % dashSpacing;
        ctx.fillStyle = "rgba(215,255,84,.18)";
        for (let y = -dashSpacing + sideOffset; y < height; y += dashSpacing) {
          ctx.fillRect(roadLeft - 17, y, 4, 24);
          ctx.fillRect(roadLeft + roadWidth + 13, y, 4, 24);
        }

        ctx.fillStyle = "#343a38";
        ctx.fillRect(roadLeft, 0, roadWidth, height);
        ctx.fillStyle = "#f4f1d8";
        ctx.fillRect(roadLeft + 5, 0, 3, height);
        ctx.fillRect(roadLeft + roadWidth - 8, 0, 3, height);
        // Lane markings
        ctx.fillStyle = "rgba(240,239,222,.43)";
        const lineHeight = 38;
        const lineGap = 31;
        const lineOffset = roadOffset % (lineHeight + lineGap);
        for (let lane = 1; lane < laneCount; lane++) {
          const x = roadLeft + laneWidth * lane - 1;
          for (let y = -lineHeight + lineOffset; y < height; y += lineHeight + lineGap) {
            ctx.fillRect(x, y, 2, lineHeight);
          }
        }
        // Subtle road sheen
        const sheen = ctx.createLinearGradient(roadLeft, 0, roadLeft + roadWidth, 0);
        sheen.addColorStop(0, "rgba(255,255,255,.015)");
        sheen.addColorStop(.5, "rgba(255,255,255,.06)");
        sheen.addColorStop(1, "rgba(255,255,255,.015)");
        ctx.fillStyle = sheen;
        ctx.fillRect(roadLeft + 9, 0, roadWidth - 18, height);

        for (const vehicle of traffic) {
          if (vehicle.type === "oil") {
            ctx.fillStyle = "rgba(12,15,14,.9)";
            ctx.beginPath();
            ctx.ellipse(vehicle.x, vehicle.y, 13, 19, -.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(215,255,84,.2)";
            ctx.beginPath(); ctx.ellipse(vehicle.x - 3, vehicle.y - 5, 5, 8, -.2, 0, Math.PI * 2); ctx.fill();
          } else {
            drawBike(vehicle.x, vehicle.y, .84, vehicle.color, false);
          }
        }

        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life);
          ctx.fillStyle = particle.color;
          ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        const bikeY = height * .77;
        if (player.invulnerable <= 0 || Math.floor(performance.now() / 90) % 2 === 0) {
          drawBike(player.x, bikeY, 1, "#d7ff54", true, player.lean);
        }
      }

      function spawnTraffic() {
        const openLanes = [0, 1, 2].filter(lane => !traffic.some(v => v.lane === lane && v.y < 115));
        if (!openLanes.length) return;
        const lane = openLanes[Math.floor(Math.random() * openLanes.length)];
        const type = Math.random() < .18 && distance > 100 ? "oil" : "bike";
        const colors = ["#ff715b", "#69c5ff", "#c48aff", "#f0a94f", "#e7ece5"];
        traffic.push({
          lane,
          x: laneCenter(lane),
          y: -42,
          type,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: .65 + Math.random() * .24,
          passed: false
        });
      }

      function burst(x, y, color) {
        for (let i = 0; i < 18; i++) {
          const angle = Math.random() * Math.PI * 2;
          const force = 1 + Math.random() * 3;
          particles.push({
            x, y, vx: Math.cos(angle) * force, vy: Math.sin(angle) * force,
            life: .65 + Math.random() * .35, size: 2 + Math.random() * 3, color
          });
        }
      }

      function playCrash() {
        if (!soundEnabled) return;
        try {
          audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "sawtooth";
          oscillator.frequency.setValueAtTime(190, audioContext.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(45, audioContext.currentTime + .28);
          gain.gain.setValueAtTime(.14, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .3);
          oscillator.connect(gain); gain.connect(audioContext.destination);
          oscillator.start(); oscillator.stop(audioContext.currentTime + .3);
        } catch (error) {
          console.warn("Audio could not be played.", error);
        }
      }

      function endGame() {
        running = false;
        burst(player.x, height * .77, "#d7ff54");
        draw();
        playCrash();
        const result = Math.floor(distance);
        if (result > best) {
          best = result;
          localStorage.setItem("neonRiderBest", String(best));
          bestNode.textContent = best;
        }
        document.getElementById("overlayEyebrow").textContent = "Ride over";
        document.getElementById("overlayTitle").innerHTML = `You rode<br>${result} meters.`;
        document.getElementById("overlayText").textContent = result >= best
          ? "New personal best! The road is calling — go again."
          : "The road is still out there. One more run?";
        startButton.textContent = "Ride again";
        overlay.classList.remove("hidden");
      }

      function startGame() {
        distance = 0;
        speed = 72;
        roadOffset = 0;
        spawnTimer = 0;
        traffic = [];
        particles = [];
        player.lane = 1;
        player.x = laneCenter(1);
        player.targetX = player.x;
        player.lean = 0;
        player.invulnerable = 0;
        running = true;
        lastTime = performance.now();
        overlay.classList.add("hidden");
        requestAnimationFrame(loop);
      }

      function update(dt) {
        const boost = keys.has("w") || keys.has("arrowup");
        const targetSpeed = boost ? 155 : 105;
        speed += (targetSpeed - speed) * Math.min(dt * 1.5, 1);
        distance += speed * dt * .12;
        roadOffset += speed * dt * .75;

        const oldX = player.x;
        player.x += (player.targetX - player.x) * Math.min(dt * 11, 1);
        player.lean = Math.max(-1, Math.min(1, (player.x - oldX) * .12));
        player.invulnerable = Math.max(0, player.invulnerable - dt);

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTraffic();
          spawnTimer = Math.max(.48, 1.12 - distance / 1400) + Math.random() * .35;
        }

        const bikeY = height * .77;
        for (const vehicle of traffic) {
          vehicle.y += speed * vehicle.speed * dt * 2.45;
          if (Math.abs(vehicle.x - player.x) < laneWidth * .31 &&
              Math.abs(vehicle.y - bikeY) < (vehicle.type === "oil" ? 29 : 41) &&
              player.invulnerable <= 0) {
            if (vehicle.type === "oil") {
              vehicle.type = "passed";
              player.invulnerable = 1.05;
              speed *= .58;
              burst(player.x, bikeY, "#e5f67c");
            } else {
              endGame();
              return;
            }
          }
          if (!vehicle.passed && vehicle.y > bikeY + 35) {
            vehicle.passed = true;
            distance += 12;
          }
        }
        traffic = traffic.filter(v => v.y < height + 60 && v.type !== "passed");
        particles = particles.filter(p => p.life > 0);
        for (const p of particles) {
          p.x += p.vx; p.y += p.vy; p.vy += .045; p.life -= dt * 1.5;
        }
        distanceNode.textContent = Math.floor(distance);
        speedNode.textContent = Math.floor(speed);
      }

      function loop(now) {
        if (!running) return;
        const dt = Math.min((now - lastTime) / 1000, .04);
        lastTime = now;
        update(dt);
        draw();
        if (running) requestAnimationFrame(loop);
      }

      function move(direction) {
        const nextLane = Math.max(0, Math.min(laneCount - 1, player.lane + direction));
        if (nextLane !== player.lane) {
          player.lane = nextLane;
          player.targetX = laneCenter(nextLane);
        }
      }

      window.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", "arrowup", " "].includes(key)) event.preventDefault();
        keys.add(key);
        if (!event.repeat && (key === "arrowleft" || key === "a")) move(-1);
        if (!event.repeat && (key === "arrowright" || key === "d")) move(1);
        if (!running && (key === "enter" || key === " ")) startGame();
      });
      window.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
      window.addEventListener("blur", () => keys.clear());
      startButton.addEventListener("click", startGame);
      document.getElementById("soundButton").addEventListener("click", event => {
        soundEnabled = !soundEnabled;
        event.currentTarget.textContent = soundEnabled ? "♫" : "♪";
        event.currentTarget.setAttribute("aria-label", soundEnabled ? "Mute sound" : "Enable sound");
      });
      document.querySelectorAll("[data-steer]").forEach(button => {
        const steer = event => {
          event.preventDefault();
          move(Number(button.dataset.steer));
        };
        button.addEventListener("pointerdown", steer);
      });
      window.addEventListener("resize", resize);
      resize();
      draw();
    })();
  </script>
</body>
</html>
